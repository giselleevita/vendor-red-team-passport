name: ollama_local
description: >
  Run the suite against a local Ollama server (OpenAI-compatible, no API key,
  no cost). Requires `ollama serve` running on localhost:11434 and the target
  model pulled (`ollama pull <model>`). Set TARGET_API_KEY to any non-empty
  placeholder value — Ollama does not check it.
provider: openai-compatible
base_url: http://localhost:11434/v1
suite_path: data/cases/cases.v1.json
only_classes: []
a9_mode: auto
params:
  temperature: 0
  max_tokens: 256
