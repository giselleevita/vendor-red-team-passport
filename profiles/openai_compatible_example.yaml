name: openai_compatible_example
description: >
  Template for running the suite against any OpenAI-compatible chat completions
  endpoint (OpenAI itself, Groq, Together, a self-hosted vLLM/Ollama server, etc.)
  instead of Featherless. Copy this file, set base_url to the target endpoint, and
  export TARGET_API_KEY before running — no code changes needed.
provider: openai-compatible
base_url: https://api.openai.com/v1
suite_path: data/cases/cases.v1.json
only_classes: []
a9_mode: auto
params:
  temperature: 0
  max_tokens: 256
