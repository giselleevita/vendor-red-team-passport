name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run unit tests
        env:
          AUTH_JWT_HS256_SECRET: ci-secret-key-32chars-padded-here
          FEATHERLESS_API_KEY: skip
          VENDOR_RTP_REPORTS_DIR: /tmp/vrtp_reports_ci
        run: pytest tests/ -v --tb=short --ignore=tests/e2e

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t vrtp:ci .
