name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (core API suite)
        run: |
          pytest -q \
            tests/api/test_auth_access.py \
            tests/api/test_tenant_isolation.py \
            tests/api/test_audit_events.py \
            tests/api/test_error_contract.py \
            tests/api/test_metrics.py \
            tests/api/test_run_jobs.py \
            tests/api/test_job_store_sql.py

      - name: Test (full suite with coverage)
        run: pytest -q --cov=apps --cov-report=term-missing
