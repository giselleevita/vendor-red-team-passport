name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run unit tests
        env:
          VRTP_API_KEY: ci-test-key
          SECRET_KEY: ci-secret-key-32chars-padded-here
          FEATHERLESS_API_KEY: skip
          VRTP_REPORTS_DIR: /tmp/vrtp_reports_ci
          VRTP_DATA_DIR: /tmp/vrtp_data_ci
        run: pytest tests/ -v --tb=short --ignore=tests/e2e

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vrtp:ci .
