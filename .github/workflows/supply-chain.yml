name: Supply Chain Evidence

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sbom-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel from reviewed source
        run: |
          pip install build==1.3.0 packaging==26.3 pyproject-hooks==1.2.0
          python -m build --wheel
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Attest wheel provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
      - name: Attest wheel SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
          sbom-path: sbom.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: v0.3-supply-chain-evidence
          path: |
            dist/*.whl
            sbom.cdx.json
      - name: Attach public evidence to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl sbom.cdx.json --clobber
