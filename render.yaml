services:
  - type: web
    name: vrtp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: VRTP_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vrtp-db
          property: connectionString
      - key: DEFAULT_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: VRTP_MAX_CONCURRENT
        value: "2"
      - key: VRTP_TIMEOUT
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      - key: VRTP_REPORTS_DIR
        value: /app/reports
      - key: VRTP_DATA_DIR
        value: /app/data

databases:
  - name: vrtp-db
    plan: free
    databaseName: vrtp
    user: vrtp
