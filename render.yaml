services:
  - type: web
    name: vrtp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: AUTH_JWT_HS256_SECRET
        sync: false
      - key: VENDOR_RTP_MANIFEST_HMAC_KEY
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: RBAC_ENABLED
        value: "true"
      - key: DEFAULT_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: VENDOR_RTP_REPORTS_DIR
        value: /app/reports
      - key: RUN_EXECUTOR_MODE
        value: external
