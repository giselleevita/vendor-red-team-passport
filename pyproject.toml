[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-red-team-passport"
version = "0.3.0"
description = "Analyst-first defensive LLM red-team passport"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.1",
  "slowapi>=0.1.9",
  "PyJWT>=2.10.1,<3",
  "redis>=6.4,<7"
]

[project.scripts]
vendor-rtp = "apps.api.cli:main"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.16.4",
  "pip-audit==2.9.0",
  "httpx2==2.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "S603"]
"tests/**/*.py" = ["S101"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.setuptools.package-data]
"apps.api" = ["templates/*.j2"]
"apps.api.resources" = ["cases/*.json", "compliance/*.yaml", "profiles/*.yaml"]
